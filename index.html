<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Mesh Slice Viewer</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand-block">
          <h1>Voxel Mesh Slice Viewer</h1>
          <p id="statusText">Ready</p>
        </div>

        <div class="top-actions">
          <label class="file-control">
            <span>Volume</span>
            <input id="volumeInput" type="file" accept=".npy,.npz" />
          </label>
          <label class="file-control">
            <span>Mesh</span>
            <input id="meshInput" type="file" accept=".ply,.obj,.stl" />
          </label>
          <label class="select-control hidden" id="arraySelectRow">
            <span>Array</span>
            <select id="arraySelect"></select>
          </label>
          <button id="demoButton" type="button">Demo</button>

          <details class="options-panel">
            <summary>Options</summary>
            <div class="options-grid">
              <label class="select-control">
                <span>Axis order</span>
                <select id="axisOrderSelect">
                  <option value="xyz">i,j,k -> x,y,z</option>
                  <option value="zyx">i,j,k -> z,y,x</option>
                </select>
              </label>
              <div class="check-row">
                <label><input id="flipX" type="checkbox" /> Flip X</label>
                <label><input id="flipY" type="checkbox" /> Flip Y</label>
                <label><input id="flipZ" type="checkbox" /> Flip Z</label>
              </div>
              <label class="select-control">
                <span>Mesh mode</span>
                <select id="meshModeSelect">
                  <option value="solid">Solid</option>
                  <option value="wireframe">Wireframe</option>
                  <option value="transparent">Transparent</option>
                  <option value="solidWire">Solid + wire</option>
                </select>
              </label>
              <label class="range-control short-range">
                <span>Opacity</span>
                <input id="meshOpacity" type="range" min="0" max="1" step="0.01" value="0.58" />
                <output id="meshOpacityValue">0.58</output>
              </label>
              <label class="checkbox-control">
                <input id="normalizeMesh" type="checkbox" />
                Normalize mesh
              </label>
              <button id="clearMeshButton" type="button">Clear mesh</button>
            </div>
          </details>
        </div>
      </header>

      <main class="workspace">
        <section class="mesh-pane">
          <div class="pane-heading">
            <div>
              <h2>Mesh + slice plane</h2>
              <span>Drag or scroll the plane</span>
            </div>
            <div class="slice-controls">
              <div class="segmented" id="sliceAxisGroup" aria-label="Slice axis">
                <button type="button" data-axis="x">X</button>
                <button type="button" data-axis="y">Y</button>
                <button type="button" data-axis="z" class="active">Z</button>
              </div>
              <label class="range-control slice-range">
                <span id="sliceLabel">Z slice</span>
                <input id="sliceSlider" type="range" min="0" max="0" value="0" disabled />
                <output id="sliceValue">-</output>
              </label>
              <button id="resetCameraButton" type="button">Reset</button>
            </div>
          </div>
          <canvas id="viewerCanvas"></canvas>
        </section>

        <section class="slice-pane">
          <div class="pane-heading">
            <div>
              <h2>Slice colors</h2>
              <span id="renderStats">No volume loaded</span>
            </div>
            <label class="select-control schema-control">
              <span>Schema</span>
              <select id="schemaSelect">
                <option value="semantic">Pipeline labels</option>
                <option value="components">CCL components</option>
                <option value="cases">CCL cases</option>
              </select>
            </label>
          </div>
          <div class="slice-canvas-shell">
            <canvas id="sliceCanvas"></canvas>
          </div>
          <div id="legendList" class="legend-list"></div>
          <dl id="inspectorList" class="inspector-list">
            <dt>Grid</dt><dd>-</dd>
            <dt>World</dt><dd>-</dd>
            <dt>Label</dt><dd>-</dd>
            <dt>Category</dt><dd>-</dd>
          </dl>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
